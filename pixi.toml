[workspace]
authors = ["Zicklag"]
channels = ["conda-forge"]
description = "CosyVoice TTS - Chinese text-to-speech for language learning"
name = "cosyvoice"
platforms = ["linux-64"]
version = "0.1.0"

[dependencies]
python = "3.10.*"
pip = "*"
# conda setuptools version pinned so uv doesn't force 81+; matcha imports pkg_resources
packaging = ">=23,<25"
setuptools = ">=69,<81"

[pypi-options]
extra-index-urls = ["https://download.pytorch.org/whl/cu121"]
index-strategy = "unsafe-best-match"

[pypi-dependencies]
# Torch from the cu121 index (works with driver 580.x, GTX 1650 sm_75)
torch = "==2.3.1+cu121"
torchaudio = "==2.3.1+cu121"
conformer = "==0.3.2"
diffusers = "==0.29.0"
gradio = "==5.4.0"
hyperpyyaml = "==1.2.3"
inflect = "==7.3.1"
librosa = "==0.10.2"
modelscope = "==1.20.0"
networkx = "==3.1"
numpy = "==1.26.4"
omegaconf = "==2.3.0"
openai-whisper = "==20231117"
protobuf = "==4.25"
pydantic = "==2.7.0"
rich = "==13.7.1"
soundfile = "==0.12.1"
transformers = "==4.51.3"
wetext = "==0.0.4"
x-transformers = "==2.11.24"
onnx = "==1.16.0"
onnxruntime-gpu = { version = "==1.18.0", index = "https://aiinfra.pkgs.visualstudio.com/PublicPackages/_packaging/onnxruntime-cuda-12/pypi/simple/" }
hydra-core = "==1.3.2"
lightning = "==2.2.4"
gdown = "==5.1.0"
matplotlib = "==3.7.5"
wget = "==3.2"
pyarrow = "==18.1.0"
pyworld = "==0.3.4"
addict = ">=2.4.0, <3"

[tasks]
# Download model weights (~3.2GB) into pretrained_models/
get-model = { cmd = "python tools/download_model.py" }
# One-shot synthesis demo
tts = { cmd = "python tts_local.py", env = { PYTHONPATH = ".:third_party/Matcha-TTS", MPLCONFIGDIR = "/tmp/mplcache", HF_HOME = "/tmp/hf_cache", MODELSCOPE_CACHE = "/tmp/modelscope_cache", HOME = "/tmp/fakehome", REQUESTS_CA_BUNDLE = "/etc/ssl/certs/ca-certificates.crt", PYTORCH_CUDA_ALLOC_CONF = "expandable_segments:True" } }
# Interactive web UI
webui = { cmd = "python webui.py --port 50000 --model_dir pretrained_models/CosyVoice2-0.5B", env = { PYTHONPATH = ".:third_party/Matcha-TTS", MPLCONFIGDIR = "/tmp/mplcache", HF_HOME = "/tmp/hf_cache", MODELSCOPE_CACHE = "/tmp/modelscope_cache", HOME = "/tmp/fakehome", REQUESTS_CA_BUNDLE = "/etc/ssl/certs/ca-certificates.crt", PYTORCH_CUDA_ALLOC_CONF = "expandable_segments:True", LD_LIBRARY_PATH = "$CONDA_PREFIX/lib:$PIXI_PROJECT_ROOT/.pixi/envs/default/lib/python3.10/site-packages/nvidia/cudnn/lib:$PIXI_PROJECT_ROOT/.pixi/envs/default/lib/python3.10/site-packages/nvidia/cublas/lib:$PIXI_PROJECT_ROOT/.pixi/envs/default/lib/python3.10/site-packages/nvidia/cuda_runtime/lib:$PIXI_PROJECT_ROOT/.pixi/envs/default/lib/python3.10/site-packages/nvidia/cuda_nvrtc/lib:$PIXI_PROJECT_ROOT/.pixi/envs/default/lib/python3.10/site-packages/nvidia/cufft/lib:$PIXI_PROJECT_ROOT/.pixi/envs/default/lib/python3.10/site-packages/nvidia/cusparse/lib:$PIXI_PROJECT_ROOT/.pixi/envs/default/lib/python3.10/site-packages/nvidia/cusolver/lib:$PIXI_PROJECT_ROOT/.pixi/envs/default/lib/python3.10/site-packages/nvidia/curand/lib" } }
